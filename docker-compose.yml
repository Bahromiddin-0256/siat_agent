# Requires NVIDIA Container Toolkit on host:
#   https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html
# Verify with:  docker run --rm --gpus all nvidia/cuda:12.4.1-base-ubuntu22.04 nvidia-smi

services:
  siat-agent:
    build:
      context: .
      dockerfile: Dockerfile
      # Seed BuildKit's uv cache from the host on first build.
      # Subsequent builds reuse the BuildKit cache mount directly.
      additional_contexts:
        host-uv-cache: ${HOME}/.cache/uv
    image: 172.16.11.58/siat-agent/siat-agent:latest
    container_name: siat-agent
    restart: unless-stopped

    env_file:
      - .env
    environment:
      PORT: "8001"
      APP_PORT: "8001"
      BGE_M3_DEVICE: "cuda"
      HF_HOME: "/home/appuser/.cache/huggingface"
      TRANSFORMERS_CACHE: "/home/appuser/.cache/huggingface"
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"

    ports:
      - "8001:8001"

    volumes:
      - ./vector/qdrant:/app/vector/qdrant
      - ./jsons:/app/jsons
      - ./logs:/app/logs
      - hf-cache:/home/appuser/.cache/huggingface

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request, os
          urllib.request.urlopen(f"http://localhost:{os.environ.get('APP_PORT','8001')}/health", timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  hf-cache: