name: Build & push image to GHCR

# Build the runtime image and push to GitHub Container Registry.
#
# Tags pushed:
#   - latest       (master only)
#   - sha-<short>  (every build, for pinning)
#   - <git tag>    (only when triggered by a tag push, e.g. v1.2.3)
#
# Pull from the VM with:
#   docker pull ghcr.io/<owner>/<repo>:latest
# then retag to the name the compose file expects:
#   docker tag ghcr.io/<owner>/<repo>:latest \
#       172.16.11.58/siat-agent/siat-agent:latest
# (See scripts/gcp-vm.sh deploy.)

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write   # required to push to ghcr.io under the repo owner

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Owner segment of GHCR must be lowercase. Repo names with underscores
      # are accepted, but the conventional package name uses dashes.
      - name: Compute image name
        id: img
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=${{ env.REGISTRY }}/${owner}/siat-agent" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag

      # Dockerfile binds a `host-uv-cache` context to seed uv's cache from
      # the developer's ~/.cache/uv. CI has no such cache — pass an empty
      # dir so the bind mount resolves; the Dockerfile's `[ -d ... ]` guard
      # keeps the seeding a no-op. GHA's cache backend handles actual reuse.
      - name: Stub host-uv-cache build context
        run: mkdir -p /tmp/empty-uv-cache

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-contexts: |
            host-uv-cache=/tmp/empty-uv-cache
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions cache backend — fast incremental builds.
          cache-from: type=gha
          cache-to: type=gha,mode=max
