services:
  vllm:
    image: vllm/vllm-openai:cu130-nightly
    container_name: siat-vllm
    restart: unless-stopped
    runtime: nvidia
    ipc: host
    ports:
      - "8003:8000"
    volumes:
      - ${HF_HOME:-~/.cache/huggingface}:/root/.cache/huggingface
      - vllm-cache:/root/.cache/vllm
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
      # Belt-and-suspenders: also disable the FlashInfer sampler.
      - VLLM_USE_FLASHINFER_SAMPLER=0
      # hf-xet stalls mid-download for large Qwen shards. Force LFS HTTP, which
      # supports resume and is reliable. Drop this once hf-xet stabilises.
      - HF_HUB_DISABLE_XET=1
      - HF_HUB_ENABLE_HF_TRANSFER=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # Force Triton attention via the AttentionConfig JSON flag.
    # Blackwell (sm_120) + cu130-nightly: FlashInfer JIT-compile hangs silently;
    # the legacy VLLM_ATTENTION_BACKEND env var is gone in this build.
    command:
      - "Qwen/Qwen3-32B-AWQ"
      - "--served-model-name"
      - "qwen3-32b"
      - "--quantization"
      - "awq_marlin"
      - "--dtype"
      - "bfloat16"
      - "--kv-cache-dtype"
      - "fp8"
      - "--max-model-len"
      - "32768"
      - "--gpu-memory-utilization"
      - "0.80"
      - "--enforce-eager"
      - "--enable-prefix-caching"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "hermes"
      - "--attention-config"
      - '{"backend":"TRITON_ATTN"}'
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 600s
      retries: 3

volumes:
  vllm-cache:
