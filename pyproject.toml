[project]
name = "siat-agent"
version = "0.1.0"
description = "SDMX ID retriever agent using LangChain and Ollama"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.3.21",
    "langchain-core>=0.3.28",
    "langchain-ollama>=0.2.2",
    "langchain-community>=0.3.16",
    "langgraph>=0.2.63",
    "python-dotenv>=1.0.1",
    "chromadb>=0.5.23",
    "sentence-transformers>=3.3.1",
    "tiktoken>=0.8.0",
]
