[project]
name = "siat-agent"
version = "0.1.0"
description = "SDMX ID retriever agent using LangChain and Ollama"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.3.21",
    "langchain-core>=0.3.28",
    "langchain-ollama>=0.2.2",
    "langchain-community>=0.3.16",
    "langgraph>=0.2.63",
    "python-dotenv>=1.0.1",
    "qdrant-client>=1.9.0",
    "FlagEmbedding>=1.2.0",
    "transformers>=4.36.0,<5.0.0",
    "tiktoken>=0.8.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "pydantic-settings>=2.12.0",
    "langchain-groq>=1.1.1",
    "langchain-openai>=1.1.6",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

