[project]
name = "siat-agent"
version = "0.1.0"
description = "SDMX ID retriever agent using LangChain and Ollama"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.3.21",
    "langchain-core>=0.3.28",
    "langchain-ollama>=0.2.2",
    "langchain-community>=0.3.16",
    "langgraph>=0.2.63",
    "python-dotenv>=1.0.1",
    "chromadb>=0.5.23",
    "sentence-transformers>=3.3.1",
    "tiktoken>=0.8.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "pydantic-settings>=2.12.0",
    "langchain-groq>=1.1.1",
    "langchain-openai>=1.1.6",
]
